<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Quiz Application</title>
    <link rel="stylesheet" href="Quiz.css">
</head>

<body>
    <div id="inputBox">
        <div id="QuestionBox">
            <div id="Qno">
                <!-- Question number and text will be updated dynamically -->
            </div>
            <div id="Options">
                <!-- Options will be dynamically generated here -->
            </div>
            <div id="Buttons">
                <button onclick="previousQuestion()" class="Btn">Previous</button>
                <button onclick="nextQuestion()" class="Btn">Next</button>
                <button onclick="submitQuiz()" class="Btn" id="submitBtn">Submit</button>
            </div>
        </div>
        <div id="resultBox" style="display: none; margin-top: 20px;">
            <!-- The result will be displayed here after submission -->
        </div>
    </div>

    <script src="Quiz.js"></script>
</body>

</html>
